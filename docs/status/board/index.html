<title>Quadro de Avanço</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Tokens de cor: troque por os do design system do projeto, se houver (manter os nomes). */
  :root{
    --bg:#F5F6F8; --panel:#FFFFFF; --panel-2:#FAFBFC; --ink:#111826; --ink-2:#63708A;
    --ink-3:#98A2B3; --line:#EBEEF2; --line-2:#E2E6EC; --brand:#2C6093; --brand-2:#58A9ED;
    --pos:#0E9F6E; --pos-bg:#E6F6EF; --neg:#E23A63; --neg-bg:#FCE8EE;
    --info:#2C6093; --info-bg:#E3F0FB; --neu:#63708A; --neu-bg:#EEF1F5; --warn:#C9791F; --warn-bg:#FDF2E2;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px -12px rgba(16,24,40,.18);
    --side:#111620; --side-line:#232B37; --side-ink:#C6CDDA; --side-mut:#6B7686;
    --scrim:rgba(8,12,20,.46);
    --ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0C0F14; --panel:#151A21; --panel-2:#1A2028; --ink:#E7ECF3; --ink-2:#96A1B2;
      --ink-3:#697384; --line:#242B35; --line-2:#2C333E; --brand:#4C86C6; --brand-2:#6FB6F0;
      --pos:#33C08A; --pos-bg:rgba(23,166,115,.16); --neg:#F1567F; --neg-bg:rgba(241,65,108,.16);
      --info:#6FB6F0; --info-bg:rgba(88,169,237,.16); --neu:#96A1B2; --neu-bg:rgba(148,161,178,.14); --warn:#E8A84E; --warn-bg:rgba(232,151,58,.16);
      --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
      --scrim:rgba(0,0,0,.6); color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0C0F14; --panel:#151A21; --panel-2:#1A2028; --ink:#E7ECF3; --ink-2:#96A1B2;
    --ink-3:#697384; --line:#242B35; --line-2:#2C333E; --brand:#4C86C6; --brand-2:#6FB6F0;
    --pos:#33C08A; --pos-bg:rgba(23,166,115,.16); --neg:#F1567F; --neg-bg:rgba(241,65,108,.16);
    --info:#6FB6F0; --info-bg:rgba(88,169,237,.16); --neu:#96A1B2; --neu-bg:rgba(148,161,178,.14); --warn:#E8A84E; --warn-bg:rgba(232,151,58,.16);
    --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  /* Cor por coluna: semântica de estado, não de série. */
  .c-design{--col:var(--neu);--col-bg:var(--neu-bg)}
  .c-dev{--col:var(--info);--col-bg:var(--info-bg)}
  .c-qas{--col:var(--warn);--col-bg:var(--warn-bg)}
  .c-prod{--col:var(--pos);--col-bg:var(--pos-bg)}
  .c-blocked{--col:var(--neg);--col-bg:var(--neg-bg)}

  .wrap{max-width:1560px;margin:0 auto;padding-inline:24px}
  @media (max-width:640px){.wrap{padding-inline:16px}}

  /* Header */
  header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px;padding-block:10px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--side);display:grid;place-items:center;color:#fff;flex-shrink:0}
  .brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .sub{display:block;font-size:12px;color:var(--ink-2);font-weight:500}
  .brand .sub b{font-family:var(--mono);font-weight:500;color:var(--ink)}
  .hdr-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
  .ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
  .ibtn:hover{color:var(--ink);border-color:var(--ink-3)}
  .ibtn svg{width:18px;height:18px}
  .tbtn{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;color:var(--ink-2);font-weight:500;font-size:13px;display:inline-flex;gap:6px;align-items:center}
  .tbtn:hover{color:var(--ink);border-color:var(--ink-3)}
  .tbtn svg{width:16px;height:16px}

  /* KPI strip */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-block:20px 14px}
  .kpi{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:border-color .15s}
  .kpi:hover{border-color:var(--col)}
  .kpi[aria-pressed="true"]{border-color:var(--col);background:var(--col-bg)}
  .kpi .ico{width:38px;height:38px;border-radius:10px;background:var(--col-bg);color:var(--col);display:grid;place-items:center;flex-shrink:0}
  .kpi .ico svg{width:19px;height:19px}
  .kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
  .kpi .val{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
  .kpi .val small{font-family:var(--ui);font-size:12px;color:var(--ink-2);font-weight:500;margin-left:6px}

  /* Filter bar */
  .filters{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:22px}
  .search{position:relative;flex:1 1 240px;min-width:200px}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3);pointer-events:none}
  .search input{width:100%;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);padding:0 12px 0 34px;color:var(--ink);font:inherit}
  .search input::placeholder{color:var(--ink-3)}
  .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--panel-2)}
  .seg button{height:36px;padding:0 12px;border:0;background:transparent;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:13px}
  .seg button+button{border-left:1px solid var(--line-2)}
  .seg button[aria-pressed="true"]{background:var(--panel);color:var(--brand);font-weight:600;box-shadow:inset 0 -2px 0 var(--brand-2)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;font-size:12.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--ink-3);color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--info-bg);border-color:transparent;color:var(--brand);font-weight:600}
  .chip .n{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  .chip[aria-pressed="true"] .n{color:var(--brand)}
  .toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:500;user-select:none}
  .toggle input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;margin:0;transition:background .15s}
  .toggle input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .toggle input:checked{background:var(--brand)}
  .toggle input:checked::after{transform:translateX(14px)}
  .count{margin-left:auto;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .count b{color:var(--ink);font-weight:600}
  .linkbtn{border:0;background:none;color:var(--brand);cursor:pointer;font-weight:600;font-size:12.5px;padding:0}
  .linkbtn:hover{text-decoration:underline}

  /* Board */
  .lane{margin-bottom:26px}
  .lane-h{display:flex;align-items:center;gap:12px;padding:0 2px 10px}
  .lane-h button{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:4px 2px;text-align:left}
  .lane-h h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.005em}
  .lane-h .n{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .lane-h .chev{width:18px;height:18px;color:var(--ink-3);transition:transform .15s}
  .lane[data-collapsed="true"] .chev{transform:rotate(-90deg)}
  .lane[data-collapsed="true"] .cols{display:none}
  .lane-h .bar{flex:1;height:1px;background:var(--line)}
  .lane-h .mini{display:flex;gap:4px}
  .lane-h .mini i{display:block;width:8px;height:8px;border-radius:2px;background:var(--col)}
  .cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
  .col{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:96px;display:flex;flex-direction:column;gap:8px}
  .col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--ink-2)}
  .col-h i{width:8px;height:8px;border-radius:2px;background:var(--col);flex-shrink:0}
  .col-h .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);text-transform:none;letter-spacing:0}
  .col-empty{flex:1;display:grid;place-items:center;color:var(--ink-3);font-size:12px;min-height:40px}
  .col-empty::before{content:"—"}

  /* Card */
  .card{position:relative;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px 15px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:7px;transition:border-color .15s,transform .15s}
  .card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--col)}
  .card:hover{border-color:var(--col);transform:translateY(-1px)}
  .card h3{margin:0;font-size:13.5px;font-weight:600;line-height:1.3;text-wrap:balance}
  .card p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .tag{height:20px;padding:0 7px;border-radius:6px;font-size:10.5px;font-weight:600;letter-spacing:.02em;display:inline-flex;align-items:center;gap:4px;border:1px solid transparent}
  .tag.l0{background:var(--info-bg);color:var(--info)}
  .tag.l1{background:color-mix(in srgb,#8A3FA0 13%,var(--panel));color:color-mix(in srgb,#8A3FA0 72%,var(--ink));border-color:color-mix(in srgb,#8A3FA0 30%,var(--panel))}
  .tag.env{background:var(--panel-2);border-color:var(--line-2);color:var(--ink-2);font-family:var(--mono);font-weight:500;letter-spacing:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag.risk{background:var(--warn-bg);color:var(--warn)}
  .tag.risk svg{width:11px;height:11px}
  .card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .card .foot .pend{color:var(--ink-2);font-weight:500}
  .card .foot .pend.zero{color:var(--pos)}
  .card .foot time{font-family:var(--mono);font-size:11px}

  .empty-all{padding:60px 20px;text-align:center;color:var(--ink-2);background:var(--panel);border:1px dashed var(--line-2);border-radius:14px}

  /* Drawer */
  .scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(2px);z-index:40;animation:fadein .15s}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 40px -20px rgba(0,0,0,.5);z-index:50;display:flex;flex-direction:column;animation:slidein .2s}
  @keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .dr-h{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
  .dr-h .st{width:40px;height:40px;border-radius:11px;background:var(--col-bg);color:var(--col);display:grid;place-items:center;flex-shrink:0}
  .dr-h .st svg{width:20px;height:20px}
  .dr-h h2{margin:0 0 4px;font-size:17px;font-weight:700;line-height:1.25;text-wrap:balance}
  .dr-h .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .dr-h .close{margin-left:auto}
  .dr-b{overflow:auto;padding:6px 20px 24px;flex:1}
  .sec{padding-block:14px;border-bottom:1px solid var(--line)}
  .sec:last-child{border-bottom:0}
  .sec h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:8px}
  .sec h4 .n{font-family:var(--mono);color:var(--ink-2);letter-spacing:0}
  .sec p{margin:0;color:var(--ink);line-height:1.5}
  .sec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .sec li{display:flex;gap:9px;align-items:flex-start;line-height:1.45;font-size:13.5px}
  .sec li svg{width:15px;height:15px;flex-shrink:0;margin-top:2px}
  .sec li.ok svg{color:var(--pos)}
  .sec li.todo svg{color:var(--warn)}
  .sec li .sha{font-family:var(--mono);font-size:12px;background:var(--panel-2);border:1px solid var(--line);padding:0 4px;border-radius:4px}
  .where{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
  .where dt{color:var(--ink-2)}
  .where dd{margin:0;font-family:var(--mono);font-size:12.5px}
  .sec h4 svg{width:13px;height:13px;color:var(--warn)}
  .risk-why{background:var(--warn-bg);border-left:3px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5}
  .risk-why .sha{font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);padding:0 4px;border-radius:4px}
  .blocked{background:var(--neg-bg);border-left:3px solid var(--neg);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45}
  .links{display:flex;flex-wrap:wrap;gap:6px}
  .links a{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line-2);color:var(--brand);text-decoration:none;font-size:12.5px;font-weight:500;max-width:100%}
  .links a:hover{border-color:var(--brand-2);background:var(--info-bg)}
  .links a svg{width:13px;height:13px;flex-shrink:0}
  .links a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .links a .br{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
  .sec .none{color:var(--ink-3);font-style:italic;font-size:13px}

  footer.ft{padding-block:26px 40px;color:var(--ink-3);font-size:12px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
  footer.ft span b{color:var(--ink-2);font-weight:500}

  @media (max-width:1180px){
    .cols{grid-template-columns:repeat(2,minmax(0,1fr))}
    .col[data-empty="true"]{display:none}
  }
  @media (max-width:720px){
    .cols{grid-template-columns:1fr}
    .count{margin-left:0;flex-basis:100%}
    .brand h1{font-size:16px}
    .drawer{width:100%}
  }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="4" height="8" rx="1"/></svg>
      </div>
      <div>
        <h1 id="board-title">Quadro de avanço</h1>
        <span class="sub"><span id="board-sub"></span>atualizado em <b id="updated-at"></b></span>
      </div>
    </div>
    <div class="hdr-actions">
      <button class="tbtn" id="collapse-all" type="button" title="Recolher ou expandir todas as raias">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <span id="collapse-label">Recolher tudo</span>
      </button>
      <button class="ibtn" id="theme" type="button" title="Alternar tema claro/escuro" aria-label="Alternar tema">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="kpis" id="kpis" aria-label="Totais por coluna"></section>

  <section class="filters" aria-label="Filtros">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar por título, resumo, pendência, SHA…" aria-label="Buscar cards" autocomplete="off">
    </label>
    <div class="seg" role="group" aria-label="Camada" id="layer">
      <button type="button" data-layer="" aria-pressed="true">Todos</button>
    </div>
    <div class="chips" id="domains" role="group" aria-label="Domínio"></div>
    <label class="toggle"><input type="checkbox" id="only-pending"> Só com pendências</label>
    <label class="toggle"><input type="checkbox" id="only-risk"> Só com risco</label>
    <div class="count">Exibindo <b id="shown">0</b> de <b id="total">0</b> · <button class="linkbtn" id="clear" type="button">Limpar filtros</button></div>
  </section>

  <div id="board"></div>
</main>

<footer class="wrap ft">
  <span>Fonte: <b>board.js</b> · só leitura; peça "atualiza o quadro" para o Claude refazer a curadoria a partir do git.</span>
  <span>Coluna = estado do plano como um todo · badge = onde o código está · git vence memória.</span>
</footer>

<div id="drawer-root"></div>

<script src="board.js"></script>
<script>
(function(){
  const B = window.BOARD;
  const $ = (s, r=document) => r.querySelector(s);
  const el = (tag, attrs={}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k,v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) n.append(k.nodeType ? k : document.createTextNode(k));
    return n;
  };
  const ICON = {
    design:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/><path d="M9 21h6"/></svg>',
    dev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>',
    qas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.5L4.5 19a1 1 0 0 0 .9 1.5h13.2a1 1 0 0 0 .9-1.5L14 9.5V3"/></svg>',
    prod:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    blocked:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    todo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/></svg>',
    warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5M12 18h.01"/></svg>',
    link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7M21 3l-9 9M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  };
  const svg = k => { const t = document.createElement('template'); t.innerHTML = ICON[k].trim(); return t.content.firstChild; };
  const fmtDate = iso => { const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; };
  const colById = Object.fromEntries(B.columns.map(c => [c.id, c]));
  const domById = Object.fromEntries(B.domains.map(d => [d.id, d]));
  const LAYERS = B.layers || [];
  // Camadas são opcionais: sem B.layers, some o seletor e as tags.
  const layerTags = c => LAYERS.filter(l => (c.layers||[]).includes(l.id)).map((l,i) => el('span', {class:`tag l${LAYERS.indexOf(l) % 2}`}, l.label));
  // Realça SHAs (7–8 hex) como código, sem exigir marcação nos dados.
  const withSha = text => {
    const parts = text.split(/\b([0-9a-f]{7,8})\b/g);
    return parts.map((p,i) => i % 2 ? el('span', {class:'sha'}, p) : p);
  };

  // ---------- estado ----------
  const state = { q:'', layer:'', domain:'', column:'', onlyPending:false, onlyRisk:false, collapsed:new Set() };
  try { const c = JSON.parse(localStorage.getItem('board.collapsed') || '[]'); c.forEach(x => state.collapsed.add(x)); } catch(e){}

  const matches = c => {
    if (state.layer && !(c.layers||[]).includes(state.layer)) return false;
    if (state.domain && c.domain !== state.domain) return false;
    if (state.column && c.column !== state.column) return false;
    if (state.onlyPending && !(c.pending && c.pending.length)) return false;
    if (state.onlyRisk && !c.risk) return false;
    if (state.q) {
      const hay = [c.title, c.summary, ...(c.delivered||[]), ...(c.pending||[]), c.blockedBy||'', c.env, c.id].join(' ').toLowerCase();
      if (!hay.includes(state.q)) return false;
    }
    return true;
  };

  // ---------- KPIs ----------
  function renderKpis(){
    const root = $('#kpis'); root.innerHTML = '';
    // Totais ignoram o filtro de coluna, para o strip continuar servindo de navegação.
    const saved = state.column; state.column = '';
    const pool = B.cards.filter(matches);
    state.column = saved;
    for (const col of B.columns) {
      const n = pool.filter(c => c.column === col.id).length;
      const risk = pool.filter(c => c.column === col.id && c.risk).length;
      root.append(el('button', {class:`kpi c-${col.id}`, type:'button', 'aria-pressed': state.column === col.id ? 'true' : 'false', title: col.hint,
        onclick: () => { state.column = state.column === col.id ? '' : col.id; render(); }},
        el('div', {class:'ico', 'aria-hidden':'true'}, svg(col.id)),
        el('div', {}, el('div', {class:'lbl'}, col.label), el('div', {class:'val'}, String(n), risk ? el('small', {}, `${risk} com risco`) : null))
      ));
    }
  }

  // ---------- filtros ----------
  function renderDomainChips(){
    const root = $('#domains'); root.innerHTML = '';
    for (const d of B.domains) {
      const n = B.cards.filter(c => c.domain === d.id).length;
      root.append(el('button', {class:'chip', type:'button', 'aria-pressed': state.domain === d.id ? 'true':'false',
        onclick: () => { state.domain = state.domain === d.id ? '' : d.id; render(); }}, d.label, el('span', {class:'n'}, String(n))));
    }
  }
  $('#q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); render(); });
  $('#layer').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.layer = b.dataset.layer; render(); });
  $('#only-pending').addEventListener('change', e => { state.onlyPending = e.target.checked; render(); });
  $('#only-risk').addEventListener('change', e => { state.onlyRisk = e.target.checked; render(); });
  $('#clear').addEventListener('click', () => {
    Object.assign(state, { q:'', layer:'', domain:'', column:'', onlyPending:false, onlyRisk:false });
    $('#q').value = ''; $('#only-pending').checked = false; $('#only-risk').checked = false; render();
  });
  $('#collapse-all').addEventListener('click', () => {
    const allCollapsed = B.domains.every(d => state.collapsed.has(d.id));
    state.collapsed = new Set(allCollapsed ? [] : B.domains.map(d => d.id));
    persistCollapsed(); render();
  });
  function persistCollapsed(){ try { localStorage.setItem('board.collapsed', JSON.stringify([...state.collapsed])); } catch(e){} }

  // ---------- board ----------
  function cardNode(c){
    const pend = (c.pending||[]).length;
    return el('button', {class:`card c-${c.column}`, type:'button', 'data-id': c.id, 'aria-haspopup':'dialog', onclick: () => openCard(c.id)},
      el('div', {class:'tags'},
        layerTags(c),
        c.risk ? el('span', {class:'tag risk', title: c.risk}, svg('warn'), 'risco') : null,
      ),
      el('h3', {}, c.title),
      el('p', {title: c.summary}, c.summary),
      el('div', {class:'foot'},
        el('span', {class:'pend' + (pend ? '' : ' zero')}, pend ? `${pend} pendência${pend > 1 ? 's' : ''}` : 'Sem pendências'),
        el('time', {datetime: c.updated, title:'Data da última evidência'}, fmtDate(c.updated))
      )
    );
  }

  function render(){
    renderKpis(); renderDomainChips();
    for (const b of document.querySelectorAll('#layer button')) b.setAttribute('aria-pressed', b.dataset.layer === state.layer ? 'true' : 'false');
    const board = $('#board'); board.innerHTML = '';
    const shown = B.cards.filter(matches);
    $('#shown').textContent = shown.length; $('#total').textContent = B.cards.length;
    $('#collapse-label').textContent = B.domains.every(d => state.collapsed.has(d.id)) ? 'Expandir tudo' : 'Recolher tudo';
    if (!shown.length) { board.append(el('div', {class:'empty-all'}, 'Nenhum card com esses filtros. ', el('button', {class:'linkbtn', type:'button', onclick: () => $('#clear').click()}, 'Limpar filtros'))); return; }

    for (const d of B.domains) {
      const cards = shown.filter(c => c.domain === d.id);
      if (!cards.length) continue;
      const collapsed = state.collapsed.has(d.id);
      const lane = el('section', {class:'lane', 'data-collapsed': collapsed ? 'true' : 'false', 'aria-label': d.label});
      const mini = el('span', {class:'mini', 'aria-hidden':'true'}, cards.map(c => el('i', {class:`c-${c.column}`})));
      lane.append(el('div', {class:'lane-h'},
        el('button', {type:'button', 'aria-expanded': collapsed ? 'false' : 'true', onclick: () => { collapsed ? state.collapsed.delete(d.id) : state.collapsed.add(d.id); persistCollapsed(); render(); }},
          svg('chev'), el('h2', {}, d.label), el('span', {class:'n'}, `${cards.length} card${cards.length > 1 ? 's' : ''}`)),
        el('span', {class:'bar'}), mini));
      const cols = el('div', {class:'cols'});
      for (const col of B.columns) {
        const inCol = cards.filter(c => c.column === col.id);
        const colEl = el('div', {class:`col c-${col.id}`, 'data-empty': inCol.length ? 'false' : 'true'},
          el('div', {class:'col-h'}, el('i'), col.label, el('span', {class:'n'}, String(inCol.length))));
        if (inCol.length) inCol.forEach(c => colEl.append(cardNode(c))); else colEl.append(el('div', {class:'col-empty', 'aria-label':'vazio'}));
        cols.append(colEl);
      }
      lane.append(cols); board.append(lane);
    }
  }

  // ---------- drawer ----------
  let lastFocus = null;
  function closeDrawer(){
    $('#drawer-root').innerHTML = '';
    document.body.style.overflow = '';
    // Em file:// o Chrome recusa replaceState; a URL é só conveniência de deep-link.
    try { if (location.hash.startsWith('#card=')) history.replaceState(null, '', location.pathname + location.search); } catch(e){}
    if (lastFocus) { lastFocus.focus(); lastFocus = null; }
  }
  function linkHref(l){
    const branch = l.branch || B.defaultBranch || 'main';
    return `${B.repoUrl}/blob/${branch}/${l.path}`;
  }
  function openCard(id){
    const c = B.cards.find(x => x.id === id); if (!c) return;
    lastFocus = document.activeElement;
    const col = colById[c.column];
    const root = $('#drawer-root'); root.innerHTML = '';
    const list = (items, kind) => items && items.length
      ? el('ul', {}, items.map(t => el('li', {class: kind}, svg(kind === 'ok' ? 'check' : 'todo'), el('span', {}, withSha(t)))))
      : el('div', {class:'none'}, kind === 'ok' ? 'Nada entregue ainda.' : 'Nenhuma pendência registrada.');
    const drawer = el('aside', {class:`drawer c-${c.column}`, role:'dialog', 'aria-modal':'true', 'aria-labelledby':'dr-title'},
      el('div', {class:'dr-h'},
        el('div', {class:'st', 'aria-hidden':'true'}, svg(c.column)),
        el('div', {style:'min-width:0;flex:1'},
          el('h2', {id:'dr-title'}, c.title),
          el('div', {class:'meta'},
            el('span', {class:'tag', style:'background:var(--col-bg);color:var(--col)'}, col.label),
            layerTags(c),
            c.risk ? el('span', {class:'tag risk', title: c.risk}, svg('warn'), 'risco') : null,
          )),
        el('button', {class:'ibtn close', type:'button', 'aria-label':'Fechar', onclick: closeDrawer}, svg('x'))),
      el('div', {class:'dr-b'},
        el('div', {class:'sec'}, el('h4', {}, 'Resumo'), el('p', {}, c.summary)),
        el('div', {class:'sec'}, el('h4', {}, 'Onde está'),
          el('dl', {class:'where'},
            el('dt', {}, 'Domínio'), el('dd', {style:'font-family:var(--ui)'}, domById[c.domain].label),
            el('dt', {}, 'Código em'), el('dd', {}, B.envs[c.env] || c.env),
            el('dt', {}, 'Última evidência'), el('dd', {}, fmtDate(c.updated)))),
        c.risk ? el('div', {class:'sec'}, el('h4', {}, svg('warn'), 'Por que é risco'), el('div', {class:'risk-why'}, withSha(c.risk))) : null,
        c.blockedBy ? el('div', {class:'sec'}, el('h4', {}, 'Bloqueado por'), el('div', {class:'blocked'}, c.blockedBy)) : null,
        el('div', {class:'sec'}, el('h4', {}, 'Entregue', el('span', {class:'n'}, String((c.delivered||[]).length))), list(c.delivered, 'ok')),
        el('div', {class:'sec'}, el('h4', {}, 'Pendente', el('span', {class:'n'}, String((c.pending||[]).length))), list(c.pending, 'todo')),
        el('div', {class:'sec'}, el('h4', {}, 'Documentos'),
          c.links && c.links.length
            ? el('div', {class:'links'}, c.links.map(l => el('a', {href: linkHref(l), target:'_blank', rel:'noopener', title: l.path}, svg('link'), el('span', {}, l.label), l.branch ? el('span', {class:'br'}, l.branch) : null)))
            : el('div', {class:'none'}, 'Sem documento vinculado.')),
      ));
    root.append(el('div', {class:'scrim', onclick: closeDrawer}), drawer);
    document.body.style.overflow = 'hidden';
    try { history.replaceState(null, '', `#card=${encodeURIComponent(id)}`); } catch(e){}
    $('.close', drawer).focus();
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#drawer-root').firstChild) closeDrawer(); });

  // ---------- tema ----------
  const root = document.documentElement;
  try { const t = localStorage.getItem('board.theme'); if (t) root.setAttribute('data-theme', t); } catch(e){}
  $('#theme').addEventListener('click', () => {
    const dark = root.getAttribute('data-theme') === 'dark' || (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    const next = dark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('board.theme', next); } catch(e){}
  });

  // ---------- boot ----------
  if (B.title) { document.title = B.title; $('#board-title').textContent = B.title; }
  if (B.subtitle) $('#board-sub').textContent = B.subtitle + ' · ';
  if (LAYERS.length) $('#layer').append(...LAYERS.map(l => el('button', {type:'button', 'data-layer': l.id, 'aria-pressed':'false'}, l.label)));
  else $('#layer').remove();
  $('#updated-at').textContent = fmtDate(B.updatedAt);
  render();
  const m = location.hash.match(/^#card=(.+)$/);
  if (m) openCard(decodeURIComponent(m[1]));
})();
</script>
